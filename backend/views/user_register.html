{{ define "user-register" }}
<!doctype html>
<html lang="en" xml:lang="en" data-theme="autumn">

<head>
  <title>Todo APP-User</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="public/style.css" rel="stylesheet" type="text/css" />
  <link href="public/fonts.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="public/htmx.min.js"></script>
  <script src="public/script.js"></script>
</head>

<body class="bg-base-200 text-base-content min-h-screen flex items-center justify-center">
  <div id="errors"></div>

  <div class="card card-xl card-border border-base-300 bg-base-100 gap-2 sm:w-2/3 lg:w-1/2 overflow-w-hidden">
    <div class="card-title p-3 justify-center">
      <h2 class="mt-5 text-center text-xl font-bold">
        New user registration
      </h2>
    </div>

    <div class="card-body gap-2">
      <form class="flex flex-col gap-4 justify-center items-center" hx-post="/register" hx-target-error="#errors">
        <label for="name" class="input w-full">
          <i class="fa-solid fa-user"></i>
          <input id="name" name="name" type="text" required class="grow" placeholder="Username" />
        </label>
        <label for="email" class="input w-full">
          <i class="fa-solid fa-envelope"></i>
          <input id="email" name="email" type="email" autocomplete="email" required class="grow" placeholder="email" />
        </label>
        <div class="w-full">
          <label id="labelPass" for="password" class="input w-full">
            <i class="fa-solid fa-key"></i>
            <input id="password" name="password" type="password" required class="grow w-full" placeholder="password"
              minlength="8" />
            <a href="#password" onclick="togglePasswordVisibility()"><i id="toggleEye" class="fa-solid fa-eye"></i></a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-outline lg:w-1/3">
          Register
        </button>
      </form>

      <p class="mt-5 text-center text-sm text-gray-500">
        Already a user?
        <a href="/?page=login" class="font-semibold leading-6 hover:text-neutral text-base-content">Login</a>
      </p>
    </div>
  </div>
</body>

</html>
{{ end }}
