name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main
      - development

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: |
          go install gotest.tools/gotestsum@latest
          mkdir coverage
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 gotestsum --format testname -- -count=1 -p 1 -coverprofile=coverage/coverage.out.tmp ./... -coverpkg=./... -timeout 5m

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux go build -v ./...

      - name: Test coverage report
        run: |
          cat coverage/coverage.out.tmp >> coverage/coverage.out
          go tool cover -func=coverage/coverage.out

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Run linter check
        uses: golangci/golangci-lint-action@030ca6c9fbdb3112d99584f1992f5216eb38ad86
        with:
          version: v2.4
          working-directory: backend/
          args: --timeout=5m
          skip-cache: false

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
