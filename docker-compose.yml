name: todo-app
services:
  db:
    container_name: todo-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - global-auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PORT: 9003
        HTTP_PORT: 9003
    container_name: todo-backend
    ports:
      - "${HTTP_PORT:-9003}:9003"
    env_file:
      - ./backend/configs/.env
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=9003
      - DB_HOST=todo-db
      - DB_PORT=5432
      - DB_NAME=todo
      - DB_USER=postgres
      - DB_PASSWORD=root123
      - FILE_LOGGING_ENABLED=false
      - LOG_LEVEL=DEBUG
      - NO_COLOR=false
      - AUTH_URL=http://auth-api:9001
      - CORS_ALLOWED_ORIGINS=http://todo-frontend:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - global-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:${HTTP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
  frontend:
    container_name: todo-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - VITE_BACKEND_URL=http://todo-backend:9003
    depends_on:
      - backend
    networks:
      - default
      - global-auth
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  global-auth:
    name: shared-auth-network
    external: true
